name: WhatsApp community sync
# Started automatically every 6 hours, or by the Start tracking / Sync now buttons on the dashboard.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC). Keeps GitHub free minutes in budget for private repos.
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = normal run, login = link the WhatsApp account"
        type: choice
        options: [sync, login]
        default: sync
      pair_phone:
        description: "For login only: WhatsApp number with country code (e.g. 919876543210). Empty = QR code on the dashboard."
        required: false

# Never run two jobs on the same WhatsApp session at once
concurrency:
  group: whatsapp-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODE: ${{ inputs.mode || 'sync' }}
      PAIR_PHONE: ${{ inputs.pair_phone }}
      TRACKER_URL: ${{ secrets.TRACKER_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      SESSION_KEY: ${{ secrets.SESSION_KEY }}
      GROUP_NAME_FILTER: ${{ vars.GROUP_NAME_FILTER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install
        working-directory: bot
        run: npm ci

      # The WhatsApp session is stored encrypted in the Actions cache.
      # SESSION_KEY is a repo secret, so even someone who can read the cache can't use it.
      - name: Restore saved WhatsApp session
        if: env.MODE == 'sync'
        uses: actions/cache/restore@v4
        with:
          path: session.tar.gz.enc
          key: wa-session-${{ github.run_id }}
          restore-keys: wa-session-

      - name: Decrypt session
        if: env.MODE == 'sync'
        working-directory: bot
        run: |
          if [ -f ../session.tar.gz.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SESSION_KEY -in ../session.tar.gz.enc | tar xz
          else
            echo "No saved WhatsApp session yet - the dashboard will ask you to link WhatsApp."
          fi

      - name: Run bot
        id: bot
        working-directory: bot
        run: node index.js

      - name: Encrypt session
        if: success()
        working-directory: bot
        run: |
          # drop browser caches, keep only what's needed to stay logged in
          find .wwebjs_auth -type d \( -name "Cache" -o -name "Code Cache" -o -name "GPUCache" -o -name "CacheStorage" -o -name "ScriptCache" \) -prune -exec rm -rf {} + || true
          if [ ! -d .wwebjs_auth ]; then echo "Nothing to save"; exit 0; fi
          tar cz .wwebjs_auth | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SESSION_KEY -out ../session.tar.gz.enc
          ls -lh ../session.tar.gz.enc

      - name: Save WhatsApp session
        if: success() && hashFiles('session.tar.gz.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: session.tar.gz.enc
          key: wa-session-${{ github.run_id }}
