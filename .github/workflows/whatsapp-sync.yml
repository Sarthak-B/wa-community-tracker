name: WhatsApp community sync
# Each run is named by what it does, so the Actions list shows it at a glance
run-name: ${{ github.event_name == 'schedule' && 'Scheduled sync' || (inputs.mode == 'send' && 'Sending messages' || (inputs.mode == 'login' && 'Linking WhatsApp' || 'Sync now')) }}
# Started automatically every 6 hours, or by the Start tracking / Sync now buttons on the dashboard.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC) = 05:47, 11:47, 17:47, 23:47 IST. If you change this, also change nextScheduled() in worker/src/dashboard.html
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = normal run, login = link the WhatsApp account, send = post messages queued in the composer"
        type: choice
        options: [sync, login, send]
        default: sync
      pair_phone:
        description: "For login only: WhatsApp number with country code (e.g. 919876543210). Empty = QR code on the dashboard."
        required: false

# The job only needs to read the repo; the session cache uses its own runner token
permissions:
  contents: read

# Never run two jobs on the same WhatsApp session at once
concurrency:
  group: whatsapp-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # normal syncs finish in a few minutes; sending waits 30-90 s between communities, so allow up to an hour
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'sync' }}
      PAIR_PHONE: ${{ inputs.pair_phone }}
      TRACKER_URL: ${{ secrets.TRACKER_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      SESSION_KEY: ${{ secrets.SESSION_KEY }}
      GROUP_NAME_FILTER: ${{ vars.GROUP_NAME_FILTER }}
      LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
      MAX_MESSAGES_PER_GROUP: ${{ vars.MAX_MESSAGES_PER_GROUP }}
      COUNT_ADMIN_POSTS: ${{ vars.COUNT_ADMIN_POSTS }}
      STALE_HOURS: ${{ vars.STALE_HOURS }}
      SEND_GAP_MIN: ${{ vars.SEND_GAP_MIN }}
      SEND_GAP_MAX: ${{ vars.SEND_GAP_MAX }}
      MAX_SENDS_PER_RUN: ${{ vars.MAX_SENDS_PER_RUN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      # GitHub's Ubuntu runners already have Chrome. Using it skips a ~150 MB Chromium download every run
      # (saves free minutes). If it is ever missing, puppeteer downloads its own as before.
      - name: Use the runner's Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
            echo "PUPPETEER_SKIP_DOWNLOAD=true" >> "$GITHUB_ENV"
            "$CHROME" --version
          else
            echo "No Chrome on the runner, puppeteer will download Chromium"
          fi

      - name: Install
        working-directory: bot
        run: npm ci

      # The WhatsApp session is stored encrypted in the Actions cache.
      # SESSION_KEY is a repo secret, so even someone who can read the cache can't use it.
      - name: Restore saved WhatsApp session
        if: env.MODE != 'login'
        uses: actions/cache/restore@v4
        with:
          path: session.tar.gz.enc
          key: wa-session-${{ github.run_id }}
          restore-keys: wa-session-

      - name: Decrypt session
        if: env.MODE != 'login'
        working-directory: bot
        run: |
          if [ -f ../session.tar.gz.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SESSION_KEY -in ../session.tar.gz.enc | tar xz
          else
            echo "No saved WhatsApp session yet - the dashboard will ask you to link WhatsApp."
          fi

      - name: Run bot
        id: bot
        working-directory: bot
        run: node index.js

      # Saved whenever WhatsApp accepted the login during this run (the bot writes .linked_ok),
      # even if the sync afterwards failed or timed out. A fresh link is never thrown away,
      # and a logged-out session never overwrites the last good one.
      - name: Encrypt session
        id: enc
        if: always()
        working-directory: bot
        run: |
          if [ ! -f .linked_ok ] || [ ! -d .wwebjs_auth ]; then echo "Not logged in during this run - keeping the previous saved session"; exit 0; fi
          # drop browser caches, keep only what's needed to stay logged in
          find .wwebjs_auth -type d \( -name "Cache" -o -name "Code Cache" -o -name "GPUCache" -o -name "CacheStorage" -o -name "ScriptCache" \) -prune -exec rm -rf {} + || true
          tar cz .wwebjs_auth | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SESSION_KEY -out ../session.tar.gz.enc
          ls -lh ../session.tar.gz.enc
          echo "saved=true" >> "$GITHUB_OUTPUT"

      - name: Save WhatsApp session
        if: always() && steps.enc.outputs.saved == 'true'
        uses: actions/cache/save@v4
        with:
          path: session.tar.gz.enc
          key: wa-session-${{ github.run_id }}
